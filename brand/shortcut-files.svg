<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Files">
  <title>Files</title>
  <!-- One of the four shortcut icons the manifest offers on the app's own icon
       (stratus-backend#311). The same square and the same gradient as
       app-icon.svg, so a launcher's menu is recognisably this app, with the
       mark behind the glyph at low opacity and the glyph itself in white.
       Full bleed, like the app icon: what masks the corners is the launcher.
       192 because that is the one size shipped, and everything draws it
       smaller. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa0ec"/>
      <stop offset="1" stop-color="#2c6fb5"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#sky)"/>
  <g transform="translate(19.2,19.2) scale(2.4)" fill="#ffffff" opacity="0.18">
    <rect x="26" y="14" width="28" height="9" rx="4.5"/>
    <rect x="10" y="27" width="44" height="9" rx="4.5"/>
    <rect x="10" y="40" width="28" height="9" rx="4.5"/>
  </g>
  <g transform="translate(48,48)" fill="#ffffff">
    <path d="M6 26h26l9 11h43a9 9 0 0 1 9 9v30a9 9 0 0 1-9 9H15a9 9 0 0 1-9-9V35a9 9 0 0 1 9-9z"/>
  </g>
</svg>
